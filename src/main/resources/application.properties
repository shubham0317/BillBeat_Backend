# Application Name & Port
spring.application.name=BillBeat
server.port=8080

# Database Configuration (Externalized env vars with local defaults)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration
billbeat.jwt.secret=${JWT_SECRET:billbeat_secret_key_for_jwt_signing_must_be_at_least_256_bits_long_for_hs256}
billbeat.jwt.expiration-ms=86400000

# WhatsApp Provider Configuration
# Mode: MOCK or META_CLOUD_API
billbeat.whatsapp.provider=${WHATSAPP_PROVIDER:MOCK}
billbeat.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:placeholder_access_token}
billbeat.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:placeholder_phone_number_id}
billbeat.whatsapp.business-account-id=${WHATSAPP_BUSINESS_ACCOUNT_ID:placeholder_business_account_id}
billbeat.whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:billbeat_webhook_verify_token}
billbeat.whatsapp.api-base-url=${WHATSAPP_API_BASE_URL:https://graph.facebook.com/v19.0}

# Billing Strategy Configuration
# Options: SCHEDULED_DAYS, ACTUAL_DELIVERIES
billbeat.billing.strategy=${BILLING_STRATEGY:SCHEDULED_DAYS}

# Schedulers Configuration
billbeat.scheduler.monthly-billing.enabled=true
billbeat.scheduler.monthly-billing.cron=${MONTHLY_BILLING_CRON:0 0 2 1 * ?}
billbeat.scheduler.whatsapp-queue.enabled=true
billbeat.scheduler.whatsapp-queue.delay-ms=10000
billbeat.scheduler.whatsapp-queue.max-retries=3

# CORS Configuration
billbeat.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
